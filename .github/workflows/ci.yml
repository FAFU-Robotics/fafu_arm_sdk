name: CI

on:
  push:
  pull_request:

jobs:
  windows-python:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build dependencies
        run: python -m pip install -r fafu_robot_python/requirements-build.txt

      - name: Run hardware-free controller tests
        run: >-
          python -m unittest discover
          -s fafu_robot_python/tests
          -p test_controller_unit.py
          -v

      - name: Build native extension
        shell: cmd
        run: fafu_robot_cpp\build.bat Release

      - name: Import native extension
        working-directory: fafu_robot_python
        run: >-
          python -c "import fafu_motor;
          assert hasattr(fafu_motor.HightorqueSerial, 'get_state_age_ms');
          print(fafu_motor.__file__)"
